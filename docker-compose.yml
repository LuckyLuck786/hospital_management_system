version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: medcore-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: medcore_hms
      POSTGRES_USER: medcore
      POSTGRES_PASSWORD: medcore_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medcore -d medcore_hms"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: medcore-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: medcore-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DATABASE_URL=postgresql://medcore:medcore_password@postgres:5432/medcore_hms?schema=public
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-change-me-too}
      - FRONTEND_URL=http://frontend:3000
    env_file:
      - .env
    ports:
      - "3001:3001"

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    container_name: medcore-frontend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
      - API_PROXY_TARGET=http://api:3001
    depends_on:
      - api

  nginx:
    image: nginx:alpine
    container_name: medcore-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - frontend

volumes:
  postgres_data:
  redis_data:
